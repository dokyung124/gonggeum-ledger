<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공금 가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fcf7f9">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>공금 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout: one phone-width column on a near-white page. white cards with soft shadows, one bright blue accent, plain sans throughout */
:root{
  --bg:#fcf7f9; --surface:#ffffff; --soft:#f9f1f5; --ink:#24191f; --sub:#5a4d54; --muted:#978a91; --line:#f2e6ec; --search:#f6e7ee;
  --accent:#d6336c; --accent-press:#c2255c; --accent-soft:#fff0f6; --accent-ink:#ffffff;
  --income:#1b64da; --expense:#d9363e; --bar:#e64980; --grid:#f7eef2;
  --shadow:0 1px 2px rgba(120,40,75,.04),0 4px 16px rgba(120,40,75,.06);
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px}
.top h1{font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em}
.statbtn{background:var(--accent-soft);border:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--accent-press);white-space:nowrap}
.statbtn:active{background:#ffdeeb}

.balance{background:var(--surface);border-radius:20px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.balance .label{font-size:14px;color:var(--sub)}
.balance .value{font-weight:600;font-size:32px;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}

.month{background:var(--surface);border-radius:20px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{font-weight:600;font-size:17px;margin:0}
.navbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--soft);color:var(--sub);font-size:18px;line-height:1}
.navbtn:active{background:var(--line)}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0}
.sums div{display:flex;flex-direction:column;gap:2px;background:var(--soft);border-radius:14px;padding:10px 14px}
.sums dt{font-size:12px;color:var(--muted)}
.sums dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.inc{color:var(--income)} .exp{color:var(--expense)}

.search{position:relative}
.search svg{position:absolute;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:1px solid transparent;background:var(--search)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.search input:focus + svg,.search:focus-within svg{color:var(--accent)}

.ledger{display:flex;flex-direction:column;gap:16px}
.day{display:flex;flex-direction:column;gap:8px}
.day h3{font-size:13px;font-weight:500;color:var(--muted);margin:0;padding:0 6px}
.rows{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 18px}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.row .memo{min-width:0;overflow-wrap:anywhere}
.row .memo small{display:block;color:var(--muted);font-size:12px}
.row .amt{text-align:right;white-space:nowrap;font-weight:600}
.row .amt small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.note{background:var(--surface);border-radius:18px;padding:24px 16px;text-align:center;color:var(--muted);font-size:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px}
.note .ghost{padding:10px 18px}
.primary.busy{opacity:.6}
html{overscroll-behavior-y:none}

.addbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,rgba(252,247,249,0));display:flex;justify-content:center}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:15px 20px;font-weight:600;width:100%;max-width:528px}
.primary:active{background:var(--accent-press)}
.primary:disabled{opacity:.4;cursor:not-allowed}

.overlay{position:fixed;inset:0;background:rgba(45,20,32,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px 18px 26px;display:flex;flex-direction:column;gap:16px;max-height:92%;overflow-y:auto;padding-bottom:calc(26px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;font-weight:600;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:13px;color:var(--sub)}
.field input[type=text],.field input[type=date]{padding:12px 14px;border-radius:12px;border:1px solid transparent;background:var(--soft);width:100%;min-height:48px}
.field{min-width:0}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:22px}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
.field input[type=text]:focus,.field input[type=date]:focus{background:var(--surface);border-color:var(--accent);outline:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--soft);padding:4px;border-radius:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border-radius:10px;padding:10px;text-align:center;color:var(--muted);font-size:16px;cursor:pointer}
.seg input:checked + label{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(25,31,40,.08)}
.seg input:checked + #lab-income{color:var(--income)}
.seg input:checked + #lab-expense{color:var(--expense)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.err{color:#c92a2a;font-size:14px;min-height:1.4em;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .primary{flex:1 1 140px;width:auto}
.ghost{background:var(--soft);border:0;border-radius:16px;padding:15px 18px;color:var(--sub);font-weight:500}
.danger{color:#c92a2a;background:#fff0f0}

.stats{gap:14px}
.closebtn{margin-left:4px;font-size:15px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mcell{display:flex;align-items:baseline;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;min-width:0;font-variant-numeric:tabular-nums}
.mcell .m{font-size:13px;color:var(--muted);width:30px;flex:none}
.mcell .v{font-weight:600;font-size:14px;margin-left:auto;white-space:nowrap}
.mcell .c{font-size:12px;color:var(--muted);white-space:nowrap;width:34px;text-align:right;flex:none}
.mcell.empty .v{color:var(--muted);font-weight:400}
.mcell.total{grid-column:1 / -1;background:var(--accent-soft)}
.mcell.total .m{width:auto;color:var(--accent-press);font-weight:600}
.mcell.total .v{color:var(--accent-press)}
.statshead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.yearnav{display:flex;align-items:center;gap:10px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.tiles div{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tiles div:first-child{background:var(--accent-soft)}
.tiles div:first-child dd{color:var(--accent-press)}
.tiles dt{font-size:12px;color:var(--muted)}
.tiles dd{margin:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.chart{margin:0;display:flex;flex-direction:column;gap:6px}
.chart figcaption{font-size:12px;color:var(--muted)}
.chartwrap{position:relative}
#chart{display:block;width:100%;height:180px;overflow:visible}
#chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
#chart .vlabel{fill:var(--ink);font-weight:600}
#chart .bar{fill:var(--bar)}
#chart .hit{fill:transparent;cursor:pointer}
#chart .hit.on{fill:var(--soft)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--surface);color:var(--ink);font-size:13px;line-height:1.45;padding:8px 12px;border-radius:12px;white-space:nowrap;display:none;transform:translateX(-50%);box-shadow:0 2px 6px rgba(25,31,40,.08),0 8px 24px rgba(25,31,40,.12)}
.tip.open{display:block}
.tablewrap{overflow-x:auto}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.mtable tr.empty td{color:var(--muted)}
.mtable tr:last-child td{border-bottom:0}

.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));margin:0 auto;max-width:528px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;display:none;z-index:20}
.toast.open{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>공금 가계부</h1>
    <button class="statbtn" id="btn-stats" type="button">수입 통계</button>
  </header>

  <section class="balance" aria-live="polite">
    <span class="label">현재 잔액</span>
    <span class="value num" id="balance">불러오는 중</span>
  </section>

  <section class="month">
    <div class="monthnav">
      <button class="navbtn" id="prev" type="button" aria-label="이전 달">‹</button>
      <h2 id="month-title"></h2>
      <button class="navbtn" id="next" type="button" aria-label="다음 달">›</button>
    </div>
    <dl class="sums">
      <div><dt>수입 합계</dt><dd class="num inc" id="sum-inc">0원</dd></div>
      <div><dt>지출 합계</dt><dd class="num exp" id="sum-exp">0원</dd></div>
    </dl>
  </section>

  <div class="search">
    <input type="search" id="q" placeholder="내역 검색 (전체 기간)" autocomplete="off" aria-label="내역 검색">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  </div>

  <section class="ledger" id="ledger"><div class="note">내역을 불러오는 중입니다.</div></section>
</div>

<div class="addbar"><button class="primary" id="btn-add" type="button" disabled>내역 추가</button></div>

<div class="overlay" id="entry-overlay">
  <form class="sheet" id="entry-form" novalidate>
    <h2 id="entry-title">내역 추가</h2>
    <div class="field">
      <span class="lab">구분</span>
      <div class="seg">
        <input type="radio" name="type" id="t-income" value="income" checked><label for="t-income" id="lab-income">수입</label>
        <input type="radio" name="type" id="t-expense" value="expense"><label for="t-expense" id="lab-expense">지출</label>
      </div>
    </div>
    <div class="field"><label for="f-date">날짜</label><input type="date" id="f-date"></div>
    <div class="field"><label for="f-memo">내역</label><input type="text" id="f-memo" maxlength="100" autocomplete="off" placeholder="예: 벨트 2개"></div>
    <div class="field"><label for="f-amount">금액 (원)</label><input type="text" id="f-amount" class="num" inputmode="numeric" autocomplete="off" placeholder="0"></div>
    <p class="err" id="entry-err" role="alert"></p>
    <div class="actions">
      <button class="primary" type="submit">저장</button>
      <button class="ghost danger" type="button" id="btn-delete">삭제</button>
      <button class="ghost" type="button" data-close>닫기</button>
    </div>
  </form>
</div>

<div class="overlay" id="stats-overlay">
  <section class="sheet stats" aria-labelledby="stats-title">
    <div class="statshead">
      <h2 id="stats-title">수입 통계</h2>
      <div class="yearnav">
        <button class="navbtn" id="y-prev" type="button" aria-label="이전 해">‹</button>
        <span id="y-label" class="num">2026년</span>
        <button class="navbtn" id="y-next" type="button" aria-label="다음 해">›</button>
        <button class="navbtn closebtn" type="button" data-close aria-label="닫기">✕</button>
      </div>
    </div>
    <dl class="tiles">
      <div><dt>연간 수입</dt><dd class="num" id="st-total">0원</dd></div>
      <div><dt>월평균</dt><dd class="num" id="st-avg">0원</dd></div>
    </dl>
    <figure class="chart">
      <figcaption>월별 수입 (단위: 만원)</figcaption>
      <div class="chartwrap" id="chartwrap"><svg id="chart" role="img" aria-label="월별 수입 막대그래프"></svg><div class="tip" id="tip" role="status"></div></div>
    </figure>
    <div class="mgrid" id="st-rows" aria-label="월별 수입과 판매 건수"></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var WEEK = ["일","월","화","수","목","금","토"];

  var sb = null;
  var rows = [];            // every entry from the shared table
  var months = {};          // "YYYY-MM" -> [{id,date,type,memo,amount,seq}] in entry order
  var startBalance = 0;
  var ready = false;
  var failed = "";
  var saving = false;
  var editing = null;       // {id, ym} while editing
  var deleteArmed = false;

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  var view = today().slice(0,7);

  function won(n){ return Math.round(n).toLocaleString("ko-KR") + "원"; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function newId(){ try { return crypto.randomUUID(); } catch(e){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); } }
  function signed(e){ return e.type === "expense" ? -e.amount : e.amount; }
  function shiftMonth(ym, by){
    var y = +ym.slice(0,4), m = +ym.slice(5,7) - 1 + by;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + "-" + pad(m + 1);
  }
  function dayLabel(date){
    var y = +date.slice(0,4), m = +date.slice(5,7), d = +date.slice(8,10);
    return m + "월 " + d + "일 (" + WEEK[new Date(y, m-1, d).getDay()] + ")";
  }
  function cleanRow(r){
    if (!r || typeof r !== "object") return null;
    var amount = Number(r.amount), date = String(r.date || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !isFinite(amount)) return null;
    return { id: String(r.id), date: date, type: r.type === "expense" ? "expense" : "income", memo: String(r.memo || ""), amount: Math.abs(Math.round(amount)), seq: Number(r.seq) || 0 };
  }
  function rebuild(){
    rows.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq - b.seq) || (a.id < b.id ? -1 : 1); });
    months = {};
    rows.forEach(function(e){ var ym = e.date.slice(0, 7); (months[ym] = months[ym] || []).push(e); });
  }

  // every entry in time order, each with the balance after it
  function timeline(){
    var all = [];
    Object.keys(months).sort().forEach(function(ym){
      var list = months[ym].map(function(e, i){ return { e: e, i: i, ym: ym }; });
      list.sort(function(a, b){ return a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : a.i - b.i; });
      all = all.concat(list);
    });
    var bal = startBalance;
    all.forEach(function(x){ bal += signed(x.e); x.bal = bal; });
    return all;
  }

  function rowHtml(x, withDate){
    var e = x.e, cls = e.type === "expense" ? "exp" : "inc", sign = e.type === "expense" ? "-" : "+";
    return '<button class="row" type="button" data-id="' + esc(e.id) + '" data-ym="' + x.ym + '">' +
      '<span class="memo">' + esc(e.memo || "(내역 없음)") + (withDate ? "<small>" + esc(e.date) + "</small>" : "") + "</span>" +
      '<span class="amt num ' + cls + '">' + sign + won(e.amount) + '<small class="num">잔액 ' + won(x.bal) + "</small></span></button>";
  }

  function render(){
    $("month-title").textContent = +view.slice(0,4) + "년 " + (+view.slice(5,7)) + "월";
    $("btn-add").disabled = !ready;
    var ledger = $("ledger");
    if (!ready){
      $("balance").textContent = failed ? "확인 불가" : "불러오는 중";
      ledger.innerHTML = '<div class="note"><span>' + esc(failed || "내역을 불러오는 중입니다.") + "</span>" + (failed && sb ? '<button class="ghost" type="button" id="btn-retry">다시 시도</button>' : "") + "</div>";
      return;
    }
    var all = timeline();
    $("balance").textContent = won(all.length ? all[all.length-1].bal : startBalance);

    var open = startBalance, inc = 0, exp = 0, mine = [];
    all.forEach(function(x){
      if (x.ym < view) open = x.bal;
      else if (x.ym === view){ mine.push(x); if (x.e.type === "expense") exp += x.e.amount; else inc += x.e.amount; }
    });
    $("sum-inc").textContent = won(inc);
    $("sum-exp").textContent = won(exp);

    var q = $("q").value.trim().toLowerCase();
    if (q){
      var hits = all.filter(function(x){ return x.e.memo.toLowerCase().indexOf(q) !== -1; }).reverse();
      if (!hits.length){ ledger.innerHTML = '<div class="note">검색 결과가 없습니다.</div>'; return; }
      var total = 0; hits.forEach(function(x){ total += signed(x.e); });
      ledger.innerHTML = '<div class="day"><h3>검색 결과 ' + hits.length + "건 · 합계 " + won(total) + '</h3><div class="rows">' +
        hits.map(function(x){ return rowHtml(x, true); }).join("") + "</div></div>";
      return;
    }
    if (!mine.length){ ledger.innerHTML = '<div class="note">이 달에는 내역이 없습니다. 아래 버튼으로 추가해 보세요.</div>'; return; }
    var html = "", cur = null;
    mine.slice().reverse().forEach(function(x){
      if (x.e.date !== cur){
        if (cur !== null) html += "</div></div>";
        cur = x.e.date;
        html += '<div class="day"><h3>' + dayLabel(cur) + '</h3><div class="rows">';
      }
      html += rowHtml(x, false);
    });
    ledger.innerHTML = html + "</div></div>";
  }
  function renderAll(){ render(); renderStats(); }

  var toastTimer = 0;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("open");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("open"); }, 5000);
  }

  function saveError(err){
    var msg = err && err.message ? String(err.message) : "";
    return /fetch|network|Failed/i.test(msg) ? "인터넷 연결을 확인하고 다시 시도해 주세요." : "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }
  function setSaving(on, label){
    saving = on;
    var btn = $("entry-form").querySelector('button[type="submit"]');
    btn.disabled = on; btn.classList.toggle("busy", on); btn.textContent = on ? (label || "저장 중…") : "저장";
    $("btn-delete").disabled = on;
  }

  function openSheet(id){ $(id).classList.add("open"); }
  function closeSheets(){ $("entry-overlay").classList.remove("open"); $("stats-overlay").classList.remove("open"); statsOpen = false; }

  function openEntry(entry, ym){
    editing = entry ? { id: entry.id, ym: ym } : null;
    deleteArmed = false;
    $("entry-title").textContent = entry ? "내역 수정" : "내역 추가";
    $("btn-delete").style.display = entry ? "" : "none";
    $("btn-delete").textContent = "삭제";
    $("entry-err").textContent = "";
    setSaving(false);
    $(entry && entry.type === "expense" ? "t-expense" : "t-income").checked = true;
    var t = today();
    $("f-date").value = entry ? entry.date : (t.slice(0,7) === view ? t : view + "-01");
    $("f-memo").value = entry ? entry.memo : "";
    $("f-amount").value = entry ? entry.amount.toLocaleString("ko-KR") : "";
    openSheet("entry-overlay");
    if (!entry) $("f-memo").focus();
  }

  $("f-amount").addEventListener("input", function(){
    var digits = this.value.replace(/[^\d]/g, "").slice(0, 12);
    this.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
  });

  $("entry-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    if (saving) return;
    var date = $("f-date").value, memo = $("f-memo").value.trim();
    var amount = Number($("f-amount").value.replace(/[^\d]/g, ""));
    var type = $("t-expense").checked ? "expense" : "income";
    var err = "";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) err = "날짜를 선택해 주세요.";
    else if (!memo) err = "내역을 입력해 주세요.";
    else if (!(amount > 0)) err = "금액을 숫자로 입력해 주세요.";
    if (err){ $("entry-err").textContent = err; return; }
    $("entry-err").textContent = "";
    var data = { date: date, type: type, memo: memo, amount: amount };
    var id = editing ? editing.id : null;
    setSaving(true);
    var req = id ? sb.from("entries").update(data).eq("id", id).select().single()
                 : sb.from("entries").insert(data).select().single();
    req.then(function(res){
      setSaving(false);
      if (res.error){ $("entry-err").textContent = saveError(res.error); return; }
      var row = cleanRow(res.data);
      if (!row){ load(); closeSheets(); return; }
      rows = rows.filter(function(e){ return e.id !== row.id; }).concat([row]);
      rebuild();
      view = row.date.slice(0, 7);
      closeSheets(); renderAll();
    }, function(e){ setSaving(false); $("entry-err").textContent = saveError(e); });
  });

  $("btn-delete").addEventListener("click", function(){
    if (!editing || saving) return;
    if (!deleteArmed){ deleteArmed = true; this.textContent = "한 번 더 누르면 삭제"; return; }
    var id = editing.id;
    setSaving(true, "삭제 중…");
    sb.from("entries").delete().eq("id", id).then(function(res){
      setSaving(false);
      if (res.error){ $("entry-err").textContent = saveError(res.error); return; }
      rows = rows.filter(function(e){ return e.id !== id; });
      rebuild(); closeSheets(); renderAll();
    }, function(e){ setSaving(false); $("entry-err").textContent = saveError(e); });
  });

  $("ledger").addEventListener("click", function(ev){
    if (ev.target.id === "btn-retry"){ failed = ""; render(); load(); return; }
    var row = ev.target.closest(".row"); if (!row || !ready) return;
    var ym = row.getAttribute("data-ym"), id = row.getAttribute("data-id");
    var entry = (months[ym] || []).filter(function(e){ return e.id === id; })[0];
    if (entry) openEntry(entry, ym);
  });

  $("btn-add").addEventListener("click", function(){ if (ready) openEntry(null); });
  $("prev").addEventListener("click", function(){ view = shiftMonth(view, -1); render(); });
  $("next").addEventListener("click", function(){ view = shiftMonth(view, 1); render(); });
  $("q").addEventListener("input", render);

  // stats
  var statYear = +today().slice(0,4);
  var statsOpen = false;
  function man(n){ return n === 0 ? "0" : (Math.round(n / 1000) / 10).toLocaleString("ko-KR") + "만"; }
  function niceStep(x){
    if (x <= 0) return 10000;
    var p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function yearData(y){
    var out = [];
    for (var m = 1; m <= 12; m++){
      var s = 0, c = 0;
      (months[y + "-" + pad(m)] || []).forEach(function(e){ if (e.type !== "expense"){ s += e.amount; c++; } });
      out.push({ m: m, inc: s, cnt: c });
    }
    return out;
  }
  function renderStats(){
    if (!statsOpen) return;
    $("y-label").textContent = statYear + "년";
    var data = yearData(statYear);
    var total = 0, active = 0, best = null;
    data.forEach(function(d){ total += d.inc; if (d.cnt) active++; if (d.inc > 0 && (!best || d.inc > best.inc)) best = d; });
    $("st-total").textContent = won(total);
    $("st-avg").textContent = active ? won(total / active) : "-";

    // chart
    var svg = $("chart"), W = Math.max(280, $("chartwrap").clientWidth || 320), H = 180;
    var padL = 36, padR = 4, padT = 22, padB = 24, iw = W - padL - padR, ih = H - padT - padB;
    var max = 0; data.forEach(function(d){ if (d.inc > max) max = d.inc; });
    var step = niceStep(max / 4), top = Math.max(step, Math.ceil(max / step) * step);
    var y = function(v){ return padT + ih - (v / top) * ih; };
    var slot = iw / 12, bw = Math.min(28, slot * 0.62);
    var h = [];
    for (var t = 0; t <= top + 1e-6; t += step){
      var yy = Math.round(y(t)) + 0.5;
      h.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(' + (t === 0 ? "--line" : "--grid") + ')" stroke-width="1"/>');
      h.push('<text x="' + (padL - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + (t === 0 ? "0" : (t / 10000).toLocaleString("ko-KR")) + "</text>");
    }
    data.forEach(function(d, i){
      var cx = padL + slot * i + slot / 2;
      h.push('<rect class="hit" data-i="' + i + '" x="' + (padL + slot * i) + '" y="' + padT + '" width="' + slot + '" height="' + ih + '"/>');
      if (d.inc > 0){
        var x0 = cx - bw / 2, x1 = cx + bw / 2, yb = y(0), yt = y(d.inc), r = Math.min(4, bw / 2, yb - yt);
        h.push('<path class="bar" pointer-events="none" d="M' + x0 + "," + yb + "V" + (yt + r) + "Q" + x0 + "," + yt + " " + (x0 + r) + "," + yt + "H" + (x1 - r) + "Q" + x1 + "," + yt + " " + x1 + "," + (yt + r) + "V" + yb + 'Z"/>');
        if (best && d === best) h.push('<text class="vlabel" x="' + cx + '" y="' + (yt - 6) + '" text-anchor="middle">' + man(d.inc) + "</text>");
      }
      h.push('<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + d.m + "월</text>");
    });
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("aria-label", statYear + "년 월별 수입 막대그래프. 연간 수입 " + won(total));
    svg.innerHTML = h.join("");
    svg._data = data; svg._geo = { padL: padL, slot: slot, W: W };
    hideTip();

    // month list: 1~6월 left column, 7~12월 right column, all visible at once
    var cells = [], cntAll = 0;
    data.forEach(function(d){ cntAll += d.cnt; });
    for (var r = 0; r < 6; r++){
      [data[r], data[r + 6]].forEach(function(d){
        cells.push('<div class="mcell' + (d.cnt ? "" : " empty") + '"><span class="m">' + d.m + '월</span><span class="v">' + (d.cnt ? won(d.inc) : "-") + '</span><span class="c">' + (d.cnt ? d.cnt + "건" : "") + "</span></div>");
      });
    }
    cells.push('<div class="mcell total"><span class="m">' + statYear + '년 합계</span><span class="v">' + won(total) + '</span><span class="c">' + cntAll + "건</span></div>");
    $("st-rows").innerHTML = cells.join("");
  }
  function hideTip(){
    $("tip").classList.remove("open");
    var on = document.querySelector("#chart .hit.on"); if (on) on.classList.remove("on");
  }
  function showTip(i){
    var svg = $("chart"), d = svg._data && svg._data[i], g = svg._geo; if (!d) return;
    hideTip();
    var hit = svg.querySelector('.hit[data-i="' + i + '"]'); if (hit) hit.classList.add("on");
    var tip = $("tip");
    tip.innerHTML = "<b>" + statYear + "년 " + d.m + "월</b><br>수입 " + won(d.inc) + " · " + d.cnt + "건";
    var px = (g.padL + g.slot * i + g.slot / 2) * ($("chartwrap").clientWidth / g.W);
    var cw = $("chartwrap").clientWidth;
    tip.classList.add("open");
    var half = tip.offsetWidth / 2;
    tip.style.left = Math.min(cw - half, Math.max(half, px)) + "px";
  }
  $("chart").addEventListener("pointerover", function(ev){ var t = ev.target; if (t.classList && t.classList.contains("hit")) showTip(+t.getAttribute("data-i")); });
  $("chart").addEventListener("click", function(ev){ var t = ev.target; if (t.classList && t.classList.contains("hit")) showTip(+t.getAttribute("data-i")); });
  $("chart").addEventListener("pointerleave", function(ev){ if (ev.pointerType === "mouse") hideTip(); });
  $("btn-stats").addEventListener("click", function(){
    statsOpen = true; openSheet("stats-overlay"); renderStats();
  });
  $("y-prev").addEventListener("click", function(){ statYear--; renderStats(); });
  $("y-next").addEventListener("click", function(){ statYear++; renderStats(); });
  window.addEventListener("resize", function(){ renderStats(); });

  document.addEventListener("click", function(ev){
    if (ev.target.hasAttribute("data-close") || ev.target.classList.contains("overlay")) closeSheets();
  });
  document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") closeSheets(); });

  render();

  // storage: one shared Supabase table for everyone who opens the app
  var cfg = window.LEDGER_CONFIG || {};
  var loading = null, reloadTimer = 0;

  function fetchAll(){
    var out = [], size = 1000;
    function page(from){
      return sb.from("entries").select("id,date,type,memo,amount,seq").order("date", { ascending: true }).order("seq", { ascending: true }).range(from, from + size - 1)
        .then(function(res){
          if (res.error) throw res.error;
          out = out.concat(res.data || []);
          return (res.data || []).length === size ? page(from + size) : out;
        });
    }
    return page(0);
  }
  function load(){
    if (loading) return loading;
    var slow = setTimeout(function(){ if (!ready){ failed = "연결이 느립니다. 잠시만 기다려 주세요."; render(); } }, 10000);
    loading = Promise.all([
      fetchAll(),
      sb.from("settings").select("start_balance").eq("id", 1).maybeSingle()
    ]).then(function(r){
      clearTimeout(slow);
      if (r[1].error) throw r[1].error;
      var v = r[1].data ? Number(r[1].data.start_balance) : 0;
      startBalance = isFinite(v) ? v : 0;
      rows = r[0].map(cleanRow).filter(Boolean);
      rebuild();
      ready = true; failed = "";
      renderAll();
    }).catch(function(err){
      clearTimeout(slow);
      if (!ready){ failed = "장부를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."; render(); }
      else toast("최신 내역을 불러오지 못했습니다.");
      if (window.console) console.error(err);
    }).then(function(){ loading = null; });
    return loading;
  }
  function scheduleReload(){
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(function(){ if (!saving) load(); }, 400);
  }

  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || /YOUR_/.test(cfg.supabaseUrl + cfg.supabaseAnonKey)){
    failed = "아직 연결 설정이 없습니다. config.js에 Supabase 주소와 키를 넣어 주세요."; render();
    return;
  }
  if (!window.supabase || typeof window.supabase.createClient !== "function"){
    failed = "앱을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요."; render();
    return;
  }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: false } });
  load();

  // other people's changes show up live, and again whenever the app comes back to the front
  try {
    sb.channel("entries-live").on("postgres_changes", { event: "*", schema: "public", table: "entries" }, scheduleReload).subscribe();
  } catch (e) {}
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") scheduleReload(); });
  window.addEventListener("pageshow", function(ev){ if (ev.persisted) scheduleReload(); });
})();
</script>
</body>
</html>
